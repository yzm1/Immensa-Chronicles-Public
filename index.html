<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Immensa Chronicles</title>
  <style>
    :root{--paper:#f5f0e6;--panel:#fffdf8;--ink:#22242a;--muted:#656b75;--line:#c9c0b2}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
    main{max-width:820px;margin:auto;padding:28px 18px 48px}h1{margin-bottom:4px}.dek{color:var(--muted);margin-top:0}
    .card{display:block;margin-top:24px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  </style>
</head>
<body><main>
  <h1>Immensa Chronicles</h1>
  <p class="dek">Public CI renderings from the Immensa worldbuilding project.</p>
  <div class="card">No generated renderer has been published yet.</div>
</main></body>
</html>
